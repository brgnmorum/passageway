<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passageway</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #1c1827;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1c1827;
      overflow: hidden;
    }

    /* 양쪽 상자 컬럼 */
    .box-column {
      position: absolute;
      top: 0;
      width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      z-index: 2;
      pointer-events: none;
    }

    .box-column.left {
      left: 0;
      align-items: flex-start;
    }

    .box-column.right {
      right: 0;
      align-items: flex-end;
    }

    /* 밤에 보는 듯한 어두운 택배 상자 */
    .box {
      background: #4b3420;
      border: 3px solid #2b1c12;
      position: relative;
      box-shadow:
        6px 6px 0 rgba(0, 0, 0, 0.28),
        inset 0 0 18px rgba(0, 0, 0, 0.24);
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      background: rgba(20, 12, 8, 0.42);
      transform: translateX(-50%);
    }

    .box::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(20, 12, 8, 0.34);
    }

    .box.small {
      width: 140px;
      height: 90px;
    }

    .box.medium {
      width: 180px;
      height: 110px;
    }

    .box.large {
      width: 220px;
      height: 130px;
    }

    .box.tall {
      width: 150px;
      height: 170px;
    }

    .box.wide {
      width: 250px;
      height: 95px;
    }

    /* 상자 중심이 화면 밖으로 나가게 */
    .box-column.left .box {
      transform: translateX(-55%);
    }

    .box-column.right .box {
      transform: translateX(55%);
    }

    /* 각진 지그재그 */
    .zigzag {
      position: absolute;
      top: 0;
      width: 170px;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .zigzag.left {
      left: 13vw;
    }

    .zigzag.right {
      right: 13vw;
    }

    .zigzag-track {
      width: 100%;
      height: 200vh;
      animation: slowDown 36s linear infinite;
    }

    .zigzag svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .zigzag path {
      fill: none;
      stroke: #ff174f;
      stroke-width: 11;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 8px rgba(255, 23, 79, 0.9))
              drop-shadow(0 0 18px rgba(255, 23, 79, 0.55));
    }

    /* 아주 천천히 아래로 내려가는 애니메이션 */
    @keyframes slowDown {
      from {
        transform: translateY(-50vh);
      }

      to {
        transform: translateY(0);
      }
    }

    /* 중앙 이미지 + 문구 */
    .center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(520px, 48vw);
      transform: translate(-50%, -50%);
      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .center-image {
      width: min(420px, 100%);
      height: auto;
      display: block;
      margin-bottom: 16px;
    }

    .center-caption {
      margin: 0;
      color: #ffffff;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      font-weight: 400;
      text-align: center;
    }

    @media (max-width: 768px) {
      .box.small {
        width: 100px;
        height: 68px;
      }

      .box.medium {
        width: 130px;
        height: 84px;
      }

      .box.large {
        width: 160px;
        height: 96px;
      }

      .box.tall {
        width: 110px;
        height: 135px;
      }

      .box.wide {
        width: 180px;
        height: 72px;
      }

      .zigzag {
        width: 120px;
      }

      .zigzag.left {
        left: 18vw;
      }

      .zigzag.right {
        right: 18vw;
      }

      .zigzag path {
        stroke-width: 9;
      }

      .center-content {
        width: 52vw;
      }

      .center-image {
        width: min(260px, 100%);
        margin-bottom: 12px;
      }

      .center-caption {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- 왼쪽 상자 -->
    <div class="box-column left">
      <div class="box medium"></div>
      <div class="box small"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box large"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 오른쪽 상자 -->
    <div class="box-column right">
      <div class="box small"></div>
      <div class="box large"></div>
      <div class="box medium"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 왼쪽 각진 지그재그 -->
    <div class="zigzag left">
      <div class="zigzag-track">
        <svg viewBox="0 0 170 2000" preserveAspectRatio="none">
          <path d="
            M 85 -120
            L 32 60
            L 138 240
            L 32 420
            L 138 600
            L 32 780
            L 138 960
            L 32 1140
            L 138 1320
            L 32 1500
            L 138 1680
            L 32 1860
            L 85 2120
          " />
        </svg>
      </div>
    </div>

    <!-- 오른쪽 각진 지그재그 -->
    <div class="zigzag right">
      <div class="zigzag-track">
        <svg viewBox="0 0 170 2000" preserveAspectRatio="none">
          <path d="
            M 85 -120
            L 138 60
            L 32 240
            L 138 420
            L 32 600
            L 138 780
            L 32 960
            L 138 1140
            L 32 1320
            L 138 1500
            L 32 1680
            L 138 1860
            L 85 2120
          " />
        </svg>
      </div>
    </div>

    <!-- 중앙 이미지와 문구 -->
    <section class="center-content">
      <img src="passageway.jpeg" alt="Passageway" class="center-image" />
      <p class="center-caption">Now you can't see me.</p>
    </section>
  </main>
</body>
</html>
