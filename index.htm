<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #cac8c7;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #cac8c7;
      overflow: hidden;
    }

    /* 양쪽 상자 컬럼 */
    .box-column {
      position: absolute;
      top: 0;
      width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      z-index: 2;
      pointer-events: none;
    }

    .box-column.left {
      left: 0;
      align-items: flex-start;
    }

    .box-column.right {
      right: 0;
      align-items: flex-end;
    }

    /* 상자 공통 */
    .box {
      background: #b9823b;
      border: 3px solid #7a4f21;
      position: relative;
      box-shadow: 5px 5px 0 rgba(70, 40, 20, 0.16);
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      background: rgba(90, 55, 25, 0.28);
      transform: translateX(-50%);
    }

    .box::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(90, 55, 25, 0.24);
    }

    .box.small {
      width: 140px;
      height: 90px;
    }

    .box.medium {
      width: 180px;
      height: 110px;
    }

    .box.large {
      width: 220px;
      height: 130px;
    }

    .box.tall {
      width: 150px;
      height: 170px;
    }

    .box.wide {
      width: 250px;
      height: 95px;
    }

    /* 상자 중심이 화면 밖으로 나가게 */
    .box-column.left .box {
      transform: translateX(-55%);
    }

    .box-column.right .box {
      transform: translateX(55%);
    }

    /* 지그재그 영역 */
    .zigzag {
      position: absolute;
      top: 0;
      width: 170px;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .zigzag.left {
      left: 13vw;
    }

    .zigzag.right {
      right: 13vw;
    }

    .zigzag-track {
      width: 100%;
      height: 200vh;
      animation: slowDown 28s linear infinite;
    }

    .zigzag svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .zigzag path {
      fill: none;
      stroke: #b3352d;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 아주 천천히 아래로 내려가는 애니메이션 */
    @keyframes slowDown {
      from {
        transform: translateY(-50vh);
      }

      to {
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .box.small {
        width: 100px;
        height: 68px;
      }

      .box.medium {
        width: 130px;
        height: 84px;
      }

      .box.large {
        width: 160px;
        height: 96px;
      }

      .box.tall {
        width: 110px;
        height: 135px;
      }

      .box.wide {
        width: 180px;
        height: 72px;
      }

      .zigzag {
        width: 120px;
      }

      .zigzag.left {
        left: 18vw;
      }

      .zigzag.right {
        right: 18vw;
      }

      .zigzag path {
        stroke-width: 8;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- 왼쪽 상자 -->
    <div class="box-column left">
      <div class="box medium"></div>
      <div class="box small"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box large"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 오른쪽 상자 -->
    <div class="box-column right">
      <div class="box small"></div>
      <div class="box large"></div>
      <div class="box medium"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 왼쪽 부드러운 지그재그 -->
    <div class="zigzag left">
      <div class="zigzag-track">
        <svg viewBox="0 0 170 2000" preserveAspectRatio="none">
          <path d="
            M 85 -100
            C 60 40, 60 120, 85 250
            C 110 380, 110 460, 85 600
            C 60 740, 60 820, 85 950
            C 110 1080, 110 1160, 85 1300
            C 60 1440, 60 1520, 85 1650
            C 110 1780, 110 1860, 85 2100
          " />
        </svg>
      </div>
    </div>

    <!-- 오른쪽 부드러운 지그재그 -->
    <div class="zigzag right">
      <div class="zigzag-track">
        <svg viewBox="0 0 170 2000" preserveAspectRatio="none">
          <path d="
            M 85 -100
            C 110 40, 110 120, 85 250
            C 60 380, 60 460, 85 600
            C 110 740, 110 820, 85 950
            C 60 1080, 60 1160, 85 1300
            C 110 1440, 110 1520, 85 1650
            C 60 1780, 60 1860, 85 2100
          " />
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
