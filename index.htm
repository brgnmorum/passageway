<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Line</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f2ea;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #f7f2ea;
    }

    /* 양쪽 상자 컬럼 */
    .box-column {
      position: absolute;
      top: 0;
      width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      z-index: 2;
      pointer-events: none;
    }

    .box-column.left {
      left: 0;
      align-items: flex-start;
    }

    .box-column.right {
      right: 0;
      align-items: flex-end;
    }

    /* 상자 공통 */
    .box {
      background: #b9823b;
      border: 3px solid #7a4f21;
      position: relative;
      box-shadow: 5px 5px 0 rgba(70, 40, 20, 0.16);
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      background: rgba(90, 55, 25, 0.28);
      transform: translateX(-50%);
    }

    .box::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(90, 55, 25, 0.24);
    }

    /* 크게 키운 상자들 */
    .box.small {
      width: 140px;
      height: 90px;
    }

    .box.medium {
      width: 180px;
      height: 110px;
    }

    .box.large {
      width: 220px;
      height: 130px;
    }

    .box.tall {
      width: 150px;
      height: 170px;
    }

    .box.wide {
      width: 250px;
      height: 95px;
    }

    /* 화면 밖으로 중심이 나가게 배치 */
    .box-column.left .box {
      transform: translateX(-55%);
    }

    .box-column.right .box {
      transform: translateX(55%);
    }

    /* 지그재그 */
    .zigzag {
      position: absolute;
      top: 0;
      width: 170px;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .zigzag.left {
      left: 13vw;
    }

    .zigzag.right {
      right: 13vw;
    }

    .zigzag svg {
      width: 100%;
      height: 100%;
    }

    .zigzag path {
      fill: none;
      stroke: #b3352d;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 가운데는 비워둠 */
    .center-space {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    @media (max-width: 768px) {
      .box.small {
        width: 100px;
        height: 68px;
      }

      .box.medium {
        width: 130px;
        height: 84px;
      }

      .box.large {
        width: 160px;
        height: 96px;
      }

      .box.tall {
        width: 110px;
        height: 135px;
      }

      .box.wide {
        width: 180px;
        height: 72px;
      }

      .zigzag {
        width: 120px;
      }

      .zigzag.left {
        left: 18vw;
      }

      .zigzag.right {
        right: 18vw;
      }

      .zigzag path {
        stroke-width: 8;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- 왼쪽 상자 -->
    <div class="box-column left">
      <div class="box medium"></div>
      <div class="box small"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box large"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 오른쪽 상자 -->
    <div class="box-column right">
      <div class="box small"></div>
      <div class="box large"></div>
      <div class="box medium"></div>
      <div class="box wide"></div>
      <div class="box tall"></div>
      <div class="box small"></div>
      <div class="box medium"></div>
    </div>

    <!-- 왼쪽 지그재그 -->
    <div class="zigzag left">
      <svg viewBox="0 0 170 1000" preserveAspectRatio="none">
        <path d="
          M 85 0
          L 20 90
          L 150 180
          L 20 270
          L 150 360
          L 20 450
          L 150 540
          L 20 630
          L 150 720
          L 20 810
          L 150 900
          L 85 1000
        " />
      </svg>
    </div>

    <!-- 오른쪽 지그재그 -->
    <div class="zigzag right">
      <svg viewBox="0 0 170 1000" preserveAspectRatio="none">
        <path d="
          M 85 0
          L 150 90
          L 20 180
          L 150 270
          L 20 360
          L 150 450
          L 20 540
          L 150 630
          L 20 720
          L 150 810
          L 20 900
          L 85 1000
        " />
      </svg>
    </div>

    <div class="center-space"></div>
  </main>
</body>
</html>
